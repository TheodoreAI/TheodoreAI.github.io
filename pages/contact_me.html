<!DOCTYPE html>
<html data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow">
    <title>Contact Me - TheodoreAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="/assets/js/site-nav.js" defer></script>
    <style>
        h1 { text-align:center; font-family:serif; font-weight:
            normal; text-transform: uppercase; border-bottom:
            9px solid #57b1dc; margin-top: 30px;}
        h2 { color: #d1633c; font-size: 1em;}
        .img-container
        {
            text-align: center;
        }
.photo-frame {
  position: relative;
  width: 50%;
  margin-left: auto;
  margin-right: auto;
}

.image {
  opacity: 1;
  display: block;
  width: 100%;
  height: auto;
  transition: .5s ease;
  display: block;
  margin-left: auto;
  margin-right: auto;
  backface-visibility: hidden;
}

.middle {
  transition: .5s ease;
  opacity: 0;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  -ms-transform: translate(-50%, -50%);
  text-align: center;
}

.photo-frame:hover .image {
  opacity: 0.3;
}

.photo-frame:hover .middle {
  opacity: 1;
}

.text {
  background-color: blue;
  color: white;
  font-size: 16px;
  padding: 16px 32px;
  border-radius: 10px;
}

    </style>
</head>
<body class="bg-dark text-light">
  <div id="site-navbar"></div>
  <div class="container py-5 text-center">
    <!--This is the contact me content-->
    <h1>Contact</h1>
    <p>Email: See resume</p>
    <p>Phone: See Resume</p>
    <p>Thank you</p>
    <!--photos of luna and nature-->
    <div class="photo-frame">
      <img id="luna" class="image" src="../assets/images/snowvador.JPG" alt="photo_luna">
      <div class="middle">
        <div class="text">"Snowvador Dali" </div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>
</body>
</html>
