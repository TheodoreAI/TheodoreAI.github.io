<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
  <title>
    Home
  </title>
  <link href="../assets/css/index.css" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="/assets/js/site-nav.js" defer></script>
</head>
<body>
  <div id="site-navbar"></div>
   <div class="container">
     <div class="row rounded rounded-3 pt-4">
         <div class="col-6 "><h2>About</h2>
          <div class="rounded-2">
             <p class="text-light">I am a Engineering Graduate Student. I have backgrounds in Applied Physics <a href="/assets/pdf/SemiconductorThesis.pdf" target="_blank"><i class="bi bi-info-circle-fill"></i>(Semiconductor Thesis)</a>, and Computer Science (Link to NASA WebSite).</p>
          </div>
         </div>
     </div>
     <div class="d-flex justify-content-center p-4 py-md-5">
        <div class="d-block p-2 mx-0 shadow rounded-3 w-340px" data-bs-theme="dark">
          <div class="d-grid gap-1">
            <div class="cal">
              <div class="cal-month">
                <button class="btn cal-btn" type="button" id="calPrevMonth" aria-label="Previous month">
                  <svg class="bi" width="16" height="16"><use xlink:href="#arrow-left-short"></use></svg>
                </button>
                <strong class="cal-month-name" id="calMonthName">June 2026</strong>
                <button class="btn cal-btn" type="button" id="calNextMonth" aria-label="Next month">
                  <svg class="bi" width="16" height="16"><use xlink:href="#arrow-right-short"></use></svg>
                </button>
              </div>
              <div class="cal-weekdays text-body-secondary">
                <div class="cal-weekday">Sun</div>
                <div class="cal-weekday">Mon</div>
                <div class="cal-weekday">Tue</div>
                <div class="cal-weekday">Wed</div>
                <div class="cal-weekday">Thu</div>
                <div class="cal-weekday">Fri</div>
                <div class="cal-weekday">Sat</div>
              </div>
              <div class="cal-days" id="calDays"></div>
            </div>
          </div>
        </div>
      </div>
   </div>
  <div id="site-footer"></div>

  <script>
    (function () {
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
      const today = new Date();
      let viewYear = today.getFullYear();
      let viewMonth = today.getMonth();

      const monthNameEl = document.getElementById('calMonthName');
      const daysEl = document.getElementById('calDays');

      function render() {
        monthNameEl.textContent = monthNames[viewMonth] + ' ' + viewYear;
        daysEl.innerHTML = '';

        const firstOfMonth = new Date(viewYear, viewMonth, 1);
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const leadingBlanks = firstOfMonth.getDay();
        const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

        for (let i = leadingBlanks; i > 0; i--) {
          const btn = document.createElement('button');
          btn.className = 'btn cal-btn';
          btn.type = 'button';
          btn.disabled = true;
          btn.textContent = daysInPrevMonth - i + 1;
          daysEl.appendChild(btn);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const btn = document.createElement('button');
          btn.className = 'btn cal-btn';
          btn.type = 'button';
          btn.textContent = day;
          const isToday = day === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear();
          if (isToday) {
            btn.classList.add('active');
            btn.setAttribute('aria-current', 'date');
          }
          daysEl.appendChild(btn);
        }
      }

      document.getElementById('calPrevMonth').addEventListener('click', () => {
        viewMonth--;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        render();
      });
      document.getElementById('calNextMonth').addEventListener('click', () => {
        viewMonth++;
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        render();
      });

      render();
    })();
  </script>
</body>
</html>
